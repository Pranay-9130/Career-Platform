services:
  - type: web
    name: careerplatform-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health/ready
    plan: free
    autoDeploy: false
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: STORAGE_PROVIDER
        value: database
      - key: DEBUG
        value: "false"
      - key: ALLOWED_ORIGINS
        value: "https://aspirepath.vercel.app,http://localhost:5173,http://127.0.0.1:5173"
      - key: FRONTEND_URL
        value: "https://aspirepath.vercel.app"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: EMAIL_PROVIDER
        value: resend
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
