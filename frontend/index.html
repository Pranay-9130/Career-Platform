<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0284c7" />
    <title>Student Career Platform — From your first project to your first job</title>
    <meta
      name="description"
      content="From your first project to your first job. Discover open-source student projects, craft ATS-optimized resumes, analyze scores with Gemini AI, and land entry-level tech roles."
    />
    <link rel="canonical" href="https://studentcareer.dev" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Student Career Platform" />
    <meta property="og:url" content="https://studentcareer.dev" />
    <meta property="og:title" content="Student Career Platform — From your first project to your first job" />
    <meta
      property="og:description"
      content="Discover open-source student projects, craft ATS-optimized resumes, analyze scores with Gemini AI, and land entry-level tech roles."
    />
    <meta property="og:image" content="https://studentcareer.dev/og-preview.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@studentcareer" />
    <meta name="twitter:title" content="Student Career Platform — From your first project to your first job" />
    <meta
      name="twitter:description"
      content="Discover open-source student projects, craft ATS-optimized resumes, analyze scores with Gemini AI, and land entry-level tech roles."
    />
    <meta name="twitter:image" content="https://studentcareer.dev/og-preview.png" />

    <!-- Structured Data (JSON-LD) Base WebSite -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Student Career Platform",
        "url": "https://studentcareer.dev",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://studentcareer.dev/projects?search={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <!-- Google Fonts: Inter & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-brand-bg text-brand-text min-h-screen antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
