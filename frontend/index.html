<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/logo-mark.png" />
    <link rel="apple-touch-icon" href="/logo-mark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0284c7" />
    <title>AspirePath — Your Journey. Your Skills. Your Future.</title>
    <meta
      name="description"
      content="From your first project to your first job. Discover open-source student projects, craft ATS-optimized resumes, analyze scores with Gemini AI, and land entry-level tech roles."
    />
    <link rel="canonical" href="https://aspirepath.vercel.app" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AspirePath" />
    <meta property="og:url" content="https://aspirepath.vercel.app" />
    <meta property="og:title" content="AspirePath — Your Journey. Your Skills. Your Future." />
    <meta
      property="og:description"
      content="Discover open-source student projects, craft ATS-optimized resumes, analyze scores with Gemini AI, and land entry-level tech roles."
    />
    <meta property="og:image" content="https://aspirepath.vercel.app/og-preview.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@aspirepath" />
    <meta name="twitter:title" content="AspirePath — Your Journey. Your Skills. Your Future." />
    <meta
      name="twitter:description"
      content="Discover open-source student projects, craft ATS-optimized resumes, analyze scores with Gemini AI, and land entry-level tech roles."
    />
    <meta name="twitter:image" content="https://aspirepath.vercel.app/og-preview.png" />

    <!-- Structured Data (JSON-LD) Base WebSite -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "AspirePath",
        "url": "https://aspirepath.vercel.app",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://aspirepath.vercel.app/projects?search={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <!-- Google Fonts: Inter & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-brand-bg text-brand-text min-h-screen antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
